name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

  package-macos:
    name: Package macOS app (${{ matrix.rid }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish PbForMac.app
        run: scripts/publish-macos.sh ${{ matrix.rid }}

      - name: Zip
        run: ditto -c -k --keepParent artifacts/${{ matrix.rid }}/PbForMac.app PbForMac-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PbForMac-${{ matrix.rid }}
          path: PbForMac-${{ matrix.rid }}.zip
